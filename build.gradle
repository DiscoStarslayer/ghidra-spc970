// Builds a Ghidra Extension for a given Ghidra installation.
//
// An absolute path to the Ghidra installation directory must be supplied either by setting the 
// GHIDRA_INSTALL_DIR environment variable or Gradle project property:
//
//     > export GHIDRA_INSTALL_DIR=<Absolute path to Ghidra> 
//     > gradle
//
//         or
//
//     > gradle -PGHIDRA_INSTALL_DIR=<Absolute path to Ghidra>
//
// Gradle should be invoked from the directory of the project to build.  Please see the
// application.gradle.min property in <GHIDRA_INSTALL_DIR>/Ghidra/application.properties
// for the minimum version of Gradle supported by the Ghidra installation you specify.

//----------------------START "DO NOT MODIFY" SECTION------------------------------
def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR) {
	ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
}
else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
	ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}

if (ghidraInstallDir) {
	apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"
}
else {
	throw new GradleException("GHIDRA_INSTALL_DIR is not defined!")
}
//----------------------END "DO NOT MODIFY" SECTION-------------------------------

repositories {
	// Declare dependency repositories here.  This is not needed if dependencies are manually 
	// dropped into the lib/ directory.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html for more info.
	// Ex: mavenCentral()
}

dependencies {
	// Any external dependencies added here will automatically be copied to the lib/ directory when
	// this extension is built.
}

def sleighLanguageDir = file('data/languages')
def sleighCompilerClasspath = files(
	fileTree("${ghidraInstallDir}/Ghidra/Framework/SoftwareModeling/lib") {
		include '*.jar'
	},
	fileTree("${ghidraInstallDir}/Ghidra/Framework/Generic/lib") {
		include '*.jar'
	},
	fileTree("${ghidraInstallDir}/Ghidra/Framework/Utility/lib") {
		include '*.jar'
	}
)

tasks.register('compileSleigh', JavaExec) {
	group = 'Ghidra'
	description = 'Compiles the SPC970 SLEIGH language with the selected Ghidra installation.'

	classpath = sleighCompilerClasspath
	mainClass = 'ghidra.pcodeCPort.slgh_compile.SleighCompile'
	workingDir = file('data')
	args '-i', 'sleighArgs.txt', '-a', 'languages'
	jvmArgs '-Djava.awt.headless=true'

	inputs.files(fileTree(sleighLanguageDir) {
		include '**/*.slaspec'
		include '**/*.sinc'
	})
	inputs.file('data/sleighArgs.txt')
	inputs.files(sleighCompilerClasspath)
	outputs.file('data/languages/spc970.sla')
}

tasks.named('buildExtension') {
	dependsOn tasks.named('compileSleigh')
	includeEmptyDirs = false
}

tasks.named('clean') {
	delete fileTree(sleighLanguageDir) {
		include '**/*.sla'
	}
}

// Keep development-only content out of the installable extension archive.
buildExtension.exclude '.git/**'
buildExtension.exclude '.gitignore'
buildExtension.exclude '.gitattributes'
buildExtension.exclude 'ghidra_*_PUBLIC/**'
